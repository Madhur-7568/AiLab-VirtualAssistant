[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "healthpulse-ai-assistant"
version = "2.0.0"
description = "A Healthcare Virtual Assistant with LLM Integration, Clinical Symptom Checker, Vitals Tracker, and Medical Doubt Chatbot."
authors = [{ name = "Madhur Dhillon", email = "madhurdhillon7@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
