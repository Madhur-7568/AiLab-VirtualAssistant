[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilistic-virtual-assistant"
version = "1.0.0"
description = "A Probabilistic Virtual Assistant implemented using Hidden Markov Models, Expectation-Maximization (Baum-Welch), and Bayesian Networks."
authors = [{ name = "Madhur Dhillon", email = "madhurdhillon7@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
